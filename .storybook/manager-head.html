<!--
  The sidebar's styles: copied from microsoft/fluentui
  apps/public-docsite-v9/.storybook/manager-head.html (MIT, see
  fluent/LICENSE), without its Microsoft favicon and meta tags. Changes: the
  colours it fixes as #11100f are variables, white in the dark scheme
  (manager.ts sets data-scheme on <html>).
-->
<style>
  :root {
    --sw-sidebar-text: #11100f;
  }

  :root[data-scheme="dark"] {
    --sw-sidebar-text: #ffffff;
  }
</style>
<style>
  @font-face {
    font-family: "Segoe UI";
    src:
      local("Segoe UI Light"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/light/latest.woff2)
        format("woff2"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/light/latest.woff)
        format("woff"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/light/latest.ttf)
        format("truetype");
    font-weight: 100;
  }

  @font-face {
    font-family: "Segoe UI";
    src:
      local("Segoe UI Semilight"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/semilight/latest.woff2)
        format("woff2"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/semilight/latest.woff)
        format("woff"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/semilight/latest.ttf)
        format("truetype");
    font-weight: 200;
  }

  @font-face {
    font-family: "Segoe UI";
    src:
      local("Segoe UI"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/normal/latest.woff2)
        format("woff2"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/normal/latest.woff)
        format("woff"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/normal/latest.ttf)
        format("truetype");
    font-weight: 400;
  }

  @font-face {
    font-family: "Segoe UI";
    src:
      local("Segoe UI Semibold"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/semibold/latest.woff2)
        format("woff2"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/semibold/latest.woff)
        format("woff"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/semibold/latest.ttf)
        format("truetype");
    font-weight: 600;
  }

  @font-face {
    font-family: "Segoe UI";
    src:
      local("Segoe UI Bold"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/bold/latest.woff2)
        format("woff2"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/bold/latest.woff)
        format("woff"),
      url(https://c.s-microsoft.com/static/fonts/segoe-ui/west-european/bold/latest.ttf)
        format("truetype");
    font-weight: 700;
  }

  #storybook-preview-iframe {
    background: transparent !important;
  }

  #storybook-explorer-searchfield {
    font-weight: 400 !important;
    font-size: 14px !important;
    letter-spacing: -0.01em !important;
    line-height: 14px !important;
  }

  .sidebar-item svg,
  .sidebar-svg-icon {
    color: var(--sw-sidebar-text) !important;
  }

  .sidebar-item[data-selected="true"] svg,
  .sidebar-item[data-selected="true"] .sidebar-svg-icon {
    color: #ffffff !important;
  }

  /**
    The `button[data-action='collapse-ref']` selector is used to ensure
    that the "Storybook Composition" (https://storybook.js.org/docs/sharing/storybook-composition) menu items
    align with the styling of the other sidebar menu items.
  */
  .sidebar-subheading,
  button[data-action="collapse-ref"] {
    font-weight: 600 !important;
    font-size: 16px !important;
    letter-spacing: 0px !important;
    line-height: 24px !important;
    text-transform: none !important;
    color: var(--sw-sidebar-text) !important;
  }

  .sidebar-subheading button,
  button[data-action="collapse-ref"] {
    display: flex !important;
    align-items: center !important;
  }

  .sidebar-item {
    align-items: center !important;
    font-weight: 400 !important;
    font-size: 14px !important;
    letter-spacing: -0.01em !important;
    line-height: 24px !important;
    color: var(--sw-sidebar-text) !important;
  }

  .sidebar-item a {
    align-items: center !important;
  }

  .sidebar-item[data-selected="true"] {
    font-weight: 600 !important;
    font-size: 14px !important;
    letter-spacing: -0.01em !important;
    line-height: 24px !important;
    color: #ffffff !important;
  }

  .sidebar-item > span:first-child,
  button[data-action="collapse-ref"] > span:first-child,
  .sidebar-item > svg {
    margin-top: 0 !important;
  }

  /*
  * Hides "Addons" button from mobile view nav.
  */
  nav > button:last-child {
    display: none;
  }

  /*
  Storybook has proposed a feature for this in https://github.com/storybookjs/storybook/issues/9209
  which will configure stories to exist in deeplink URL format, but do not appear in the nav tree or the docs page
  Using suggested temporary workaround until storybook gets proper support
  See https://github.com/microsoft/fluentui/blob/master/docs/react-v9/contributing/rfcs/react-components/convergence/authoring-stories.md#10-internal-stories-for-testing
  */
  [id*="accessibility-stories"] {
    display: none !important;
  }
</style>

<!--
  Storybook 10's markup: the group headings' capitals are on the button inside
  them, which Fluent's rules (for Storybook 9) don't reach.
-->
<style>
  .sidebar-subheading button {
    font-weight: 600 !important;
    font-size: 16px !important;
    letter-spacing: 0px !important;
    line-height: 24px !important;
    text-transform: none !important;
    color: var(--sw-sidebar-text) !important;
  }
</style>
