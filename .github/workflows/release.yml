name: Release

# While there are changesets, keeps a "chore: release" PR open; merging it
# publishes the new versions to npm and creates the GitHub release. The
# publish job runs none of the repository's code.
#
# Setup: each package's trusted publisher on npmjs.com (release.yml,
# environment npm, allow `npm publish`), and Actions allowed to create PRs.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, and never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Open or update the release PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version
          commit-message: "chore: release"
          pr-title: "chore: release"

  build:
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.release.outputs.pending }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build, check and pack
        id: release
        run: bun run release
      - name: Upload the release
        if: steps.release.outputs.pending == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.pending == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # the tag and GitHub release
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # Trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Update npm
        run: npm install -g npm@11
      # Core first. Versions already on npm are skipped, so a failed run can be
      # rerun.
      - name: Publish to npm
        run: |
          while read -r name version file; do
            if [ "$(npm view "${name}@${version}" version 2>/dev/null)" = "$version" ]; then
              echo "${name}@${version} is on npm already"
              continue
            fi
            npm publish "release/${file}" --access public
          done < release/packages
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "v${VERSION}" --notes-file release/notes.md
          fi
