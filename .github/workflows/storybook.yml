name: Storybook

# Builds the Storybook. ui.siiway.org (wrangler.jsonc) shows the published
# version: a release (release.yml) runs this on its tag, and a run on a v* tag
# by hand redeploys that version. A push to a branch that changes what it's
# built from only builds it: preview.yml, which runs from main, deploys it as
# the branch's Preview. Only the deploy job, which runs nothing but wrangler,
# gets the token.
#
# Setup: CLOUDFLARE_API_TOKEN, with Workers Scripts:Edit, and Workers
# Routes:Edit and Zone:Read on siiway.org, in the `production` environment,
# for v* tags. Wrangler finds the account from the token.

on:
  push:
    # Dependabot's pushes get no secrets.
    branches: ["**", "!dependabot/**"]
    paths:
      - "docs/**"
      - ".storybook/**"
      - "packages/*/src/**"
      - "packages/*/package.json"
      - "packages/*/tsconfig.json"
      - "tsconfig.base.json"
      - "package.json"
      - "bun.lock"
      - "scripts/llms.ts"
      - "wrangler.jsonc"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # A branch makes a Preview; only a release tag ships the site.
    if: startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # A Preview is ahead of the published version, so the Introduction
      # names its branch and commit instead.
      - name: Build Storybook
        run: |
          case "$GITHUB_REF" in
            refs/heads/*) export STORYBOOK_VERSION="${GITHUB_REF_NAME}@${GITHUB_SHA::7}" ;;
          esac
          bun run build-storybook
      # Each page as Markdown, for "Copy Page" and llms.txt, which the front
      # page points to.
      - name: Install Playwright's Chromium
        run: bunx playwright install --with-deps chromium
      - name: Write the pages as Markdown
        run: bun run llms
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook
          path: storybook-static
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ui.siiway.org
    # Never cancel a deploy halfway.
    concurrency:
      group: storybook-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # No Bun cache: this job has the token.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook
          path: ${{ runner.temp }}/storybook
      # Only the output, and no symbolic links in it.
      - name: Take the build
        env:
          BUILD: ${{ runner.temp }}/storybook
        run: |
          if [ -n "$(find "$BUILD" -type l -print -quit)" ]; then
            echo "::error::The build has symbolic links."
            exit 1
          fi
          rm -rf storybook-static
          mv "$BUILD" storybook-static
      - name: Deploy the site
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
